name: 🚀 Deploy Sociofy Client - Production

on:
  push:
    branches:
      - client
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install --force

      - name: 🔨 Build TypeScript + Vite
        run: npm run build

      - name: 📂 Verify dist output
        run: |
          echo "Contents of dist folder:"
          ls -la dist || echo "⚠️ dist not found!"

      - name: 🛡️ Write SSH Key to File
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

      - name: 🚚 Rsync dist folder to EC2 home
        run: |
          echo "✅ Sending files to EC2 temporary directory..."
          rsync -avz -e "ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no -p ${{ secrets.EC2_SSH_PORT }}" dist/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/sociofy-dist/

      - name: 🔁 Move dist to nginx + Reload
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            echo "♻️ Removing old files from /usr/share/nginx/html/"
            sudo rm -rf /usr/share/nginx/html/*
            echo "📂 Copying new files from ~/sociofy-dist/"
            sudo cp -r ~/sociofy-dist/* /usr/share/nginx/html/
            echo "🔁 Reloading NGINX..."
            sudo nginx -t && sudo systemctl reload nginx
